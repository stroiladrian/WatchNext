name: Update data
on:
  schedule: [{ cron: '0 5,11,17 * * *' }]   # 3x/day UTC; or trigger via cron-job.org like Stirile Libere
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node fetch-data.mjs
        env:
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
          OMDB_KEY: ${{ secrets.OMDB_KEY }}
      - run: |
          git config user.name "bot"; git config user.email "bot@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || (git commit -m "Update data" && git push)
