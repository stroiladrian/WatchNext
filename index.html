<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#121216">
<title>WatchNext – ce merită văzut acum</title>
<link rel="stylesheet" href="style.css?v=5">
</head>
<body>
<div class="app">
  <header class="top">
    <div class="logo">WATCH<br><span>NEXT</span></div>
    <div class="updated" id="updated"></div>
  </header>

  <label class="search">
    <svg viewBox="0 0 24 24" width="18" height="18"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M20 20l-4-4" stroke="currentColor" stroke-width="2" fill="none"/></svg>
    <input id="q" type="search" placeholder="Căutați filme sau seriale" autocomplete="off">
  </label>

  <nav class="tabs" id="tabs">
    <button data-type="movie" class="on">Filme</button>
    <button data-type="tv">Seriale</button>
  </nav>

  <section id="heroSec">
    <h2 class="hero-title">Avanpremiere<span>..</span></h2>
    <p class="sub" id="heroSub">Cele mai bine cotate din noutăți</p>
    <div class="hero" id="hero"></div>
  </section>

  <section>
    <div class="row-head">
      <h2 id="listTitle">Toate Filmele</h2>
      <button class="filters-btn" id="fBtn">Filtre
        <svg viewBox="0 0 24 24" width="22" height="22"><path d="M4 6h10M4 12h7M4 18h4M18 5v13m0 0l-3-3m3 3l3-3" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="filters" id="filters" hidden>
      <div class="chips" id="sortChips">
        <button data-s="rt" class="on">Rating RT</button>
        <button data-s="new">Cele mai noi</button>
        <button data-s="pop">Populare</button>
      </div>
      <div class="chips" id="minChips">
        <button data-m="0" class="on">Toate</button>
        <button data-m="60">60%+</button>
        <button data-m="75">75%+</button>
        <button data-m="90">90%+</button>
      </div>
    </div>
    <div class="grid" id="grid"></div>
    <p class="empty" id="empty" hidden>Nimic găsit.</p>
  </section>

  <footer>Scoruri: Rotten Tomatoes (prin OMDb) · Date: TMDB · Aplicație independentă, neafiliată.</footer>
</div>

<div class="modal" id="modal" hidden>
  <div class="sheet" id="sheet"></div>
</div>
<script src="app.js?v=5"></script>
</body>
</html>
